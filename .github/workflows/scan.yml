name: Sweep Scan

on:
  schedule:
    - cron: "15 0 * * *"   # daily  — 00:15 UTC every day (after the 1D close)
    - cron: "15 0 * * 1"   # weekly — 00:15 UTC Mondays (after the 1W close)
    - cron: "15 0 1 * *"   # monthly— 00:15 UTC on the 1st (after the 1M close)
  workflow_dispatch:        # manual run — pick a timeframe below
    inputs:
      timeframe:
        description: "Timeframe to scan"
        type: choice
        default: daily
        options: [daily, weekly, monthly]

# Allow the job to commit signals.jsonl back to the repo.
permissions:
  contents: write

# Serialize runs so overlapping schedules (e.g. Monday the 1st) don't race on
# the signals.jsonl commit-back.
concurrency:
  group: sweep-scan-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Resolve timeframe
        id: tf
        run: |
          INPUT="${{ github.event.inputs.timeframe }}"
          SCHED="${{ github.event.schedule }}"
          if [ -n "$INPUT" ]; then
            case "$INPUT" in
              weekly)  TF=1w ;;
              monthly) TF=1M ;;
              *)       TF=1d ;;
            esac
          else
            case "$SCHED" in
              "15 0 * * 1") TF=1w ;;
              "15 0 1 * *") TF=1M ;;
              *)            TF=1d ;;
            esac
          fi
          echo "tf=$TF" >> "$GITHUB_OUTPUT"
          # Send the performance digest on the weekly run only (avoids daily spam).
          if [ "$TF" = "1w" ]; then echo "digest=1" >> "$GITHUB_OUTPUT"; else echo "digest=0" >> "$GITHUB_OUTPUT"; fi
          echo "Resolved timeframe: $TF"

      - name: Run scanner (scan + log new signals)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAME: ${{ steps.tf.outputs.tf }}
        run: python scanner.py

      - name: Evaluate outcomes (+ weekly digest)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST: ${{ steps.tf.outputs.digest }}
        run: python evaluate.py

      - name: Commit signal log + message archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.jsonl signals_archive.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update signal log + archive [skip ci]"
            git push || (git pull --rebase && git push)
          fi
