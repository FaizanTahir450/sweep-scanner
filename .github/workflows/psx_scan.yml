name: PSX Sweep Scan

on:
  schedule:
    # Off the top of the hour: GitHub delays top-of-hour schedules most (this run has fired
    # up to 8.5 h late). The scanner compares session to session, so lateness is harmless.
    - cron: "23 12 * * 1-5"  # daily  — 17:23 PKT Mon–Fri (PSX closes 15:30 Mon–Thu / 16:30 Fri; bar final by ~16:45)
    - cron: "37 12 * * 5"    # weekly — 17:37 PKT Fridays (after the week's last session)
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to scan"
        type: choice
        default: daily
        options: [daily, weekly]
      dry_run:
        description: "Dry run - print the message in the job log, send nothing, commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Same group as the crypto workflow so the two commit-backs never race.
concurrency:
  group: sweep-scan-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # start from the branch TIP even when queued behind a run that committed state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Resolve timeframe
        id: tf
        run: |
          INPUT="${{ github.event.inputs.timeframe }}"
          SCHED="${{ github.event.schedule }}"
          TF=1d
          if [ "$INPUT" = "weekly" ] || [ "$SCHED" = "37 12 * * 5" ]; then TF=1w; fi
          echo "tf=$TF" >> "$GITHUB_OUTPUT"
          echo "Resolved timeframe: $TF"

      - name: Run PSX scanner (scan + log new signals)
        env:
          MARKET: psx
          TIMEFRAME: ${{ steps.tf.outputs.tf }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Evaluate outcomes
        if: ${{ inputs.dry_run != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST: "0"   # the weekly crypto run sends the combined digest
        run: python evaluate.py

      - name: Commit signal log, archive and PSX history cache
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.jsonl signals_archive.txt psx_cache
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: PSX scan — update signal log + cache [skip ci]"
            git push || (git pull --rebase && git push)
          fi
